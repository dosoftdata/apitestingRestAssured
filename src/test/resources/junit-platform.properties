cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.mode.default = same_thread
cucumber.execution.parallel.mode.classes.default = concurrent
cucumber.execution.parallel.config.fixed.parallelism=20
# Enable pretty console output
cucumber.plugin=pretty, summary, plugins.externalTestData.ExternalTestDataPlugin, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
testdata.file=src/test/resources/testdata/testdata.csv
cucumber.features = classpath:Suites
cucumber.glue =com.apitesting.dsl.actions, com.apitesting.hooks